# Logstash SIEM Parsing & Correlation Pipeline - Week 7 Task 3
input {
  beats {
    port => 5044
  }
  syslog {
    port => 514
    type => "network_firewall"
  }
}

filter {
  # Parse SSH Failed Login Attempts
  if [log_source] == "linux_endpoint" and [message] =~ "Failed password" {
    grok {
      match => { "message" => "Failed password for (invalid user )?%{USERNAME:target_user} from %{IP:attacker_ip} port %{NUMBER:src_port}" }
    }
    mutate {
      add_tag => ["security_alert", "ssh_failed_login"]
      add_field => { "alert_severity" => "High" }
      add_field => { "mitre_technique" => "T1110 - Brute Force" }
    }
  }

  # Detect Web Path Traversal / SQLi Attempts in Access Logs
  if [log_source] == "web_server" and [message] =~ "(\.\./\.\./|UNION\+SELECT|<script>)" {
    mutate {
      add_tag => ["security_alert", "web_attack_detected"]
      add_field => { "alert_severity" => "Critical" }
      add_field => { "mitre_technique" => "T1190 - Exploit Public-Facing Application" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "siem-security-events-%{+YYYY.MM.dd}"
  }
}
